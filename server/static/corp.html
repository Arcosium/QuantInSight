<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운용위원회 사무실 · QuantInSight</title>
<!-- 사장 지시 2026-09-25: 대시보드 헤더 '시각화' → /corp. 사이드바 조직도 직원(발화자)만 등장하고,
     말풍선은 /api/events·/ws 로 들어온 실제 agent_msg 원문이다. 지어낸 대사·가짜 상태 표시 없음. -->
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F1E8;--paper-dim:#EDE8DB;--ink:#1C1914;--ink-soft:#4A443A;--ink-faint:#6E675A;
  --rule:rgba(28,25,20,.8);--hairline:rgba(28,25,20,.18);--hairline-soft:rgba(28,25,20,.1);
  --red:#A63A22;--red-soft:#F0E2E0;--ok:#3F6B45;
  --serif:'Noto Serif KR','Apple SD Gothic Neo',serif;--sans:'Noto Sans KR',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.6;word-break:keep-all;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.micro{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;color:var(--ink-faint)}

/* ── 마스트헤드 ── */
.mast{display:flex;align-items:center;gap:20px;padding:14px 28px;border-bottom:1px solid var(--rule)}
.mast .back{font-family:var(--mono);font-size:.78rem;text-decoration:none;color:var(--ink-soft);white-space:nowrap}
.mast .back:hover{color:var(--ink);text-decoration:underline}
.mast h1{font-family:var(--serif);font-weight:900;font-size:1.35rem;letter-spacing:.02em;white-space:nowrap}
.conn{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.74rem;color:var(--ink-soft);white-space:nowrap}
.mark{width:7px;height:7px;background:var(--ink-faint);flex-shrink:0}
.conn[data-state="live"] .mark{background:var(--ok)}
.conn[data-state="down"] .mark{background:var(--red)}

/* ── 본문: 평면도 + 발언 기록 ── */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:calc(100vh - 58px)}
.plan-col{padding:22px 28px 28px;border-right:1px solid var(--rule);min-width:0}
.plan-note{font-size:.84rem;color:var(--ink-soft);margin-bottom:14px;max-width:62ch}
.office{position:relative;display:grid;border:2px solid var(--ink);
  grid-template-columns:1fr 1fr;grid-template-areas:"research ops" "meeting after" "desk desk"}
.room{position:relative;padding:12px 14px 16px;min-height:170px}
.room+.room{}
.room[data-room="research"]{grid-area:research;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.room[data-room="ops"]{grid-area:ops;border-bottom:1px solid var(--rule)}
.room[data-room="meeting"]{grid-area:meeting;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.room[data-room="after"]{grid-area:after;border-bottom:1px solid var(--rule)}
.room[data-room="desk"]{grid-area:desk}
.room .micro{display:block;margin-bottom:10px}
.desks{display:grid;grid-template-columns:repeat(var(--c,3),minmax(0,1fr));gap:74px 12px;padding-top:62px}
[data-room="research"] .desks,[data-room="ops"] .desks{--c:2}
.desk{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.desk .table{width:78px;height:22px;border:1px solid var(--rule);position:relative;background:var(--paper)}
.desk .table::after{content:"";position:absolute;left:28px;top:3px;width:20px;height:9px;border:1px solid var(--ink-faint)}
.desk .seat{position:absolute;left:50%;top:-4px;width:1px;height:1px}
.desk .nm{margin-top:7px;font-size:.8rem;font-weight:700;line-height:1.3}
.desk .tag{font-family:var(--mono);font-size:.68rem;color:var(--ink-faint)}
/* 회의실: 탁자 하나 + 좌석 */
.meet{position:relative;height:150px;margin-top:62px}
.meet .board{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:62%;height:44px;border:1px solid var(--rule)}
.meet .seat{position:absolute;width:1px;height:1px}
.meet .who{position:absolute;top:86px;font-size:.8rem;font-weight:700;text-align:center;transform:translateX(-50%);white-space:nowrap}
.meet .who .tag{display:block;font-family:var(--mono);font-size:.68rem;font-weight:400;color:var(--ink-faint)}

/* ── 사람 ── */
.people{position:absolute;inset:0;pointer-events:none}
.p{position:absolute;left:0;top:0;width:30px;height:44px;margin:-44px 0 0 -15px;pointer-events:auto;cursor:pointer;
  background:none;border:0;padding:0;transition:transform 1.4s cubic-bezier(.45,.05,.3,1);will-change:transform}
.p:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.p svg{display:block;width:30px;height:44px;overflow:visible}
.p .head{fill:var(--ink)}
.p .body{fill:var(--ink-soft)}
.p .leg{stroke:var(--ink);stroke-width:2.4;stroke-linecap:square}
.p.talking .body{fill:var(--red)}
.p.dim{opacity:.55}
.bubble{position:absolute;bottom:52px;left:50%;width:max-content;max-width:250px;padding:9px 11px 10px;
  background:var(--paper);border:1px solid var(--ink);font-size:.8rem;line-height:1.5;text-align:left;
  color:var(--ink);opacity:0;transform:translate(var(--bx,-50%),4px);transition:opacity .25s,transform .25s;pointer-events:none;z-index:3}
.bubble::after{content:"";position:absolute;left:calc(50% - var(--bx-tail,0px));bottom:-6px;width:10px;height:10px;
  background:var(--paper);border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble b{display:block;font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.08em;color:var(--ink-faint);margin-bottom:3px}
.p.talking .bubble{opacity:1;transform:translate(var(--bx,-50%),0)}
.p.talking{z-index:4}

@media (prefers-reduced-motion:no-preference){
  .p.walking .leg-a{animation:stepA .42s steps(2) infinite}
  .p.walking .leg-b{animation:stepB .42s steps(2) infinite}
  .p.working svg{animation:type 2.6s ease-in-out infinite}
}
@keyframes stepA{0%{transform:rotate(14deg)}100%{transform:rotate(-14deg)}}
@keyframes stepB{0%{transform:rotate(-14deg)}100%{transform:rotate(14deg)}}
@keyframes type{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.leg-a,.leg-b{transform-box:fill-box;transform-origin:50% 0}
@media (prefers-reduced-motion:reduce){.p{transition:none}.bubble{transition:none}}

/* ── 발언 기록 ── */
.log-col{display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 58px);position:sticky;top:0}
.log-head{padding:22px 22px 10px;border-bottom:1px solid var(--rule);display:flex;align-items:baseline;gap:10px}
.log-head h2{font-family:var(--serif);font-weight:600;font-size:1.02rem}
.log-head .micro{margin-left:auto;letter-spacing:.08em;text-transform:none}
.log{overflow-y:auto;flex:1;padding:0 22px 22px}
.msg{padding:12px 0 13px;border-bottom:1px solid var(--hairline);scroll-margin-top:12px}
.msg .meta{display:flex;gap:10px;align-items:baseline;margin-bottom:3px}
.msg .who{font-weight:700;font-size:.86rem}
.msg .t{font-family:var(--mono);font-size:.7rem;color:var(--ink-faint);margin-left:auto}
.msg .tx{font-size:.84rem;color:var(--ink-soft);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.long:not(.open) .tx{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.msg .more{margin-top:6px;background:none;border:0;border-bottom:1px solid var(--ink-faint);padding:0;font:500 .72rem var(--mono);color:var(--ink-soft);cursor:pointer}
.msg .more:hover{color:var(--ink);border-color:var(--ink)}
.msg.flash{background:var(--paper-dim)}
.empty{padding:22px 0;color:var(--ink-faint);font-size:.86rem}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .plan-col{border-right:0;border-bottom:1px solid var(--rule);padding:16px 16px 20px}
  .log-col{position:static;max-height:none}
  .log{max-height:75vh;padding:0 16px 24px}
  .log-head{padding:18px 16px 10px}
  .mast{padding:12px 16px;gap:14px}
}
@media (max-width:640px){
  .office{grid-template-columns:1fr;grid-template-areas:"research" "ops" "meeting" "after" "desk"}
  .room{border-right:0!important;border-bottom:1px solid var(--rule)}
  .room[data-room="desk"]{border-bottom:0}
  .desks{--c:2!important;gap:70px 10px;padding-top:58px}
  .mast h1{font-size:1.1rem}
  .conn .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .bubble{max-width:200px;font-size:.76rem}
}
</style>
</head>
<body>
<header class="mast">
  <a class="back" href="/">← 대시보드</a>
  <h1>운용위원회 사무실</h1>
  <div class="conn" id="conn" data-state="wait" aria-live="polite"><span class="mark"></span><span class="lbl" id="connText">연결 중</span></div>
</header>

<main class="wrap">
  <section class="plan-col" aria-label="사무실 평면도">
    <p class="plan-note">말풍선은 각 직원(에이전트)이 실제로 남긴 발언입니다. 사람을 누르면 발언 기록에서 그 사람의 최근 발언 전문을 찾아 줍니다.</p>
    <div class="office" id="office">
      <div class="room" data-room="research"><span class="micro">리서치실</span><div class="desks"></div></div>
      <div class="room" data-room="ops"><span class="micro">운용실</span><div class="desks"></div></div>
      <div class="room" data-room="meeting"><span class="micro">위원회 회의실</span>
        <div class="meet" id="meet">
          <div class="board"></div>
          <span class="seat" data-seat="bull" style="left:26%;top:22px"></span>
          <span class="seat" data-seat="bear" style="left:74%;top:22px"></span>
          <span class="seat" data-seat="chair" style="left:50%;top:22px"></span>
          <span class="seat" data-seat="guest" style="left:38%;top:22px"></span>
          <span class="who" style="left:26%">매수 심사역<span class="tag">#매수논거</span></span>
          <span class="who" style="left:74%">보유 심사역<span class="tag">#리스크검증</span></span>
        </div>
      </div>
      <div class="room" data-room="after"><span class="micro">사후관리실</span><div class="desks"></div></div>
      <div class="room" data-room="desk"><span class="micro">리스크·체결 데스크</span><div class="desks"></div></div>
      <div class="people" id="people"></div>
    </div>
  </section>

  <section class="log-col" aria-label="발언 기록">
    <div class="log-head"><h2>발언 기록</h2><span class="micro" id="count"></span></div>
    <div class="log" id="log" role="log" aria-live="polite"><p class="empty" id="empty">불러오는 중입니다.</p></div>
  </section>
</main>

<script>
(()=>{
// 사이드바 조직도(index.html)와 같은 명단·직무 태그. 새 직책을 여기서 만들지 않는다.
const STAFF=[
  ["글로벌리서치팀장","#자산배분","research"],["마켓센티먼트팀장","#뉴스감성","research"],
  ["계량분석팀장","#퀀트점수","research"],["기업리서치팀장","#기업분석","research"],
  ["주식운용실장","#종목선정","ops"],["포트폴리오기획팀장","#진입계획","ops"],
  ["채권운용실장","#채권배분","ops"],["원자재운용실장","#원자재배분","ops"],
  ["매수 심사역","#매수논거","meeting:bull"],["보유 심사역","#리스크검증","meeting:bear"],
  ["사후관리실장","#매도판단","after"],["유지 심사역","#보유논거","after"],["매도 심사역","#매도논거","after"],
  ["리스크관리실장","#결정론게이트","desk"],["프롭트레이딩팀장","#주문체결","desk"],["운용지원실장","#자동튜닝","desk"],
];
const CHIEFS=new Set(["주식운용실장","채권운용실장","원자재운용실장"]);
const office=document.getElementById("office"),layer=document.getElementById("people");
const logEl=document.getElementById("log"),emptyEl=document.getElementById("empty");
const people={};

const FIG=`<svg viewBox="0 0 30 44" aria-hidden="true"><circle class="head" cx="15" cy="7" r="5.2"/>
<path class="body" d="M9 14h12l2 15H7z"/><line class="leg leg-a" x1="12" y1="29" x2="12" y2="41"/>
<line class="leg leg-b" x1="18" y1="29" x2="18" y2="41"/></svg>`;

for(const [name,tag,where] of STAFF){
  let anchor;
  if(where.startsWith("meeting:")){
    anchor=document.querySelector(`#meet [data-seat="${where.split(":")[1]}"]`);
  }else{
    const d=document.createElement("div");d.className="desk";
    d.innerHTML=`<span class="seat"></span><div class="table"></div><div class="nm"></div><div class="tag"></div>`;
    d.querySelector(".nm").textContent=name;d.querySelector(".tag").textContent=tag;
    office.querySelector(`[data-room="${where}"] .desks`).appendChild(d);
    anchor=d.querySelector(".seat");
  }
  const b=document.createElement("button");b.className="p working";b.type="button";
  b.setAttribute("aria-label",`${name} — 최근 발언 보기`);
  b.innerHTML=FIG+`<span class="bubble"><b></b><span class="bt"></span></span>`;
  b.addEventListener("click",()=>jumpTo(name));
  layer.appendChild(b);
  people[name]={el:b,anchor,at:null,away:false,last:null};
}

// ── 좌표: 평면도 안 앵커의 위치(px). 레이아웃이 바뀌면 다시 앉힌다. ──
function pos(anchor,dx=0){
  const o=office.getBoundingClientRect(),a=anchor.getBoundingClientRect();
  return [a.left-o.left+dx,a.top-o.top];
}
function place(p,xy){p.at=xy;p.el.style.transform=`translate(${xy[0]}px,${xy[1]}px)`;fitBubble(p)}
function home(p){place(p,pos(p.anchor));p.away=false}
function fitBubble(p){
  // 말풍선이 평면도 밖으로 나가지 않게 좌우 기준을 옮긴다.
  const w=office.clientWidth,x=p.at?p.at[0]:0,half=Math.min(125,(w-20)/2);
  let shift=0;if(x-half<8)shift=half-x+8;else if(x+half>w-8)shift=w-8-half-x;
  p.el.style.setProperty("--bx",`calc(-50% + ${shift}px)`);p.el.style.setProperty("--bx-tail",`${shift}px`);
}
function layout(){for(const p of Object.values(people)){if(!p.away)home(p);else fitBubble(p)}}
new ResizeObserver(layout).observe(office);

// ── 발언 기록 ──
const clean=s=>String(s||"").replace(/\*\*/g,"").replace(/^#+\s*/gm,"").replace(/\n{3,}/g,"\n\n").trim();
const hhmm=ts=>{const m=String(ts||"").match(/(\d{2}):(\d{2})/);return m?`${m[1]}:${m[2]}`:""};
const mmdd=ts=>{const m=String(ts||"").match(/\d{4}-(\d{2})-(\d{2})/);return m?`${m[1]}.${m[2]}`:""};
let n=0;
function addLog(ev){
  if(emptyEl.isConnected)emptyEl.remove();
  const stick=logEl.scrollHeight-logEl.scrollTop-logEl.clientHeight<40;
  const d=document.createElement("article");d.className="msg";d.id="m"+(++n);
  d.innerHTML=`<div class="meta"><span class="who"></span><span class="t"></span></div><div class="tx"></div>`;
  d.querySelector(".who").textContent=ev.agent;
  d.querySelector(".t").textContent=`${mmdd(ev.ts)} ${hhmm(ev.ts)}`.trim();
  const body=clean(ev.message);d.querySelector(".tx").textContent=body;
  if(body.length>260||body.split("\n").length>7){
    d.classList.add("long");const m=document.createElement("button");m.type="button";m.className="more";m.textContent="전문 보기";
    m.addEventListener("click",()=>{const o=d.classList.toggle("open");m.textContent=o?"접기":"전문 보기"});d.appendChild(m);
  }
  logEl.appendChild(d);
  while(logEl.children.length>200)logEl.firstElementChild.remove();
  document.getElementById("count").textContent=`${logEl.children.length}건`;
  if(stick)logEl.scrollTop=logEl.scrollHeight;
  people[ev.agent].last=d.id;
}
function jumpTo(name){
  const id=people[name].last,d=id&&document.getElementById(id);
  if(!d){return}
  if(d.classList.contains("long")&&!d.classList.contains("open"))d.querySelector(".more").click();
  d.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  d.classList.add("flash");setTimeout(()=>d.classList.remove("flash"),1600);
}

// ── 말하기 대기열: 한 번에 한 사람만 말해서 말풍선이 겹치지 않게 한다. ──
const queue=[];let busy=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function target(ev){
  const text=ev.message||"";
  if(CHIEFS.has(ev.agent)&&/심의/.test(text))return {seat:"chair"};
  for(const [name] of STAFF){
    if(name!==ev.agent&&text.includes(name)&&!people[name].away)return {visit:name};
  }
  return null;
}
async function walk(p,xy){
  if(!p.at){place(p,xy);return}
  const dist=Math.hypot(xy[0]-p.at[0],xy[1]-p.at[1]);if(dist<4)return;
  p.el.classList.add("walking");p.el.classList.remove("working");
  place(p,xy);await sleep(matchMedia("(prefers-reduced-motion: reduce)").matches?0:1400);
  p.el.classList.remove("walking");
}
async function speak(ev){
  const p=people[ev.agent],t=target(ev);
  if(t&&t.seat){p.away=true;await walk(p,pos(document.querySelector(`#meet [data-seat="${t.seat}"]`)));}
  else if(t&&t.visit){p.away=true;const q=people[t.visit];await walk(p,[q.at[0]+(q.at[0]>p.at[0]?-34:34),q.at[1]]);}
  const txt=clean(ev.message).replace(/\s+/g," ");
  p.el.querySelector(".bubble b").textContent=`${ev.agent} · ${hhmm(ev.ts)}`;
  p.el.querySelector(".bt").textContent=txt.length>120?txt.slice(0,118)+"…":txt;
  fitBubble(p);p.el.classList.add("talking");
  const base=Math.min(9000,Math.max(3500,2400+txt.length*22));
  await sleep(queue.length>6?Math.min(base,2600):base);
  p.el.classList.remove("talking");
  if(t&&t.visit){await walk(p,pos(p.anchor));p.away=false}
  else if(t&&t.seat){setTimeout(()=>{if(!p.el.classList.contains("talking")){walk(p,pos(p.anchor)).then(()=>{p.away=false;p.el.classList.add("working")})}},12000)}
  p.el.classList.add("working");
}
async function pump(){
  if(busy)return;busy=true;
  while(queue.length){await speak(queue.shift())}
  busy=false;
}
function take(ev,{replay}={}){
  if(!ev||ev.type!=="agent_msg"||!people[ev.agent]||!String(ev.message||"").trim())return;
  addLog(ev);
  if(!replay){queue.push(ev);pump()}
}

// ── 데이터: 지난 발언(/api/events) + 실시간(/ws) ──
const conn=document.getElementById("conn"),connText=document.getElementById("connText");
function setConn(state,text){conn.dataset.state=state;connText.textContent=text}
async function loadHistory(){
  try{
    const r=await fetch("/api/events?limit=300",{credentials:"same-origin",cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const evs=((await r.json()).events||[]).filter(e=>e.type==="agent_msg"&&people[e.agent]);
    evs.slice(-120).forEach(e=>take(e,{replay:true}));
    logEl.scrollTop=logEl.scrollHeight;
    if(!evs.length)emptyEl.textContent="아직 남은 발언이 없습니다. 스웜이 사이클을 돌면 여기에 쌓입니다.";
    // 최근 발언 몇 개는 사무실에서 다시 들려준다(시각이 함께 표시된다).
    evs.slice(-4).forEach(e=>queue.push(e));pump();
  }catch(e){emptyEl.textContent="지난 발언을 불러오지 못했습니다. 로그인 상태를 확인해 주세요."}
}
let ws,retry=1000;
function connect(){
  const proto=location.protocol==="https:"?"wss":"ws";
  try{ws=new WebSocket(`${proto}://${location.host}/ws`)}catch(e){setConn("down","실시간 연결 실패");return}
  ws.onopen=()=>{retry=1000;setConn("live","실시간 연결됨")};
  ws.onmessage=e=>{try{take(JSON.parse(e.data))}catch(_){}};
  ws.onclose=()=>{setConn("down","연결 끊김 · 다시 연결하는 중");setTimeout(connect,retry);retry=Math.min(retry*2,30000)};
}
requestAnimationFrame(()=>{layout();loadHistory();connect()});
})();
</script>
